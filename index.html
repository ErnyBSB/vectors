<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0a0c10;
    --surface:  #111318;
    --surface2: #181b22;
    --border:   rgba(255,255,255,0.07);
    --border2:  rgba(255,255,255,0.13);
    --text:     #e8e6df;
    --muted:    #6b6e78;
    --accent:   #c8f064;
    --accent2:  #64c8f0;
    --mono:     'DM Mono', monospace;
    --serif:    'Instrument Serif', serif;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--mono); overflow: hidden; }

  /* ── layout ── */
  .shell { display: grid; grid-template-columns: 1fr 280px; grid-template-rows: 48px 1fr; height: 100vh; }

  /* ── topbar ── */
  .topbar {
    grid-column: 1/-1;
    display: flex; align-items: center; gap: 16px;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .topbar-title { font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--text); letter-spacing: .01em; }
  .topbar-tag { font-size: 10px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; padding: 3px 8px; border: 1px solid var(--border2); border-radius: 4px; }
  .topbar-spacer { flex: 1; }
  .topbar-hint { font-size: 11px; color: var(--muted); }

  /* ── canvas area ── */
  #canvas-area {
    position: relative; overflow: hidden;
    background: var(--bg);
    cursor: grab;
  }
  #canvas-area:active { cursor: grabbing; }
  #cv { width: 100%; height: 100%; display: block; }

  /* ── axis labels overlay ── */
  .axis-label {
    position: absolute; font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; pointer-events: none;
    opacity: .5;
  }

  /* ── tooltip ── */
  #tip {
    position: absolute; pointer-events: none;
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 6px; padding: 7px 12px;
    font-size: 12px; color: var(--text);
    display: none; white-space: nowrap;
    letter-spacing: .04em;
  }
  #tip .tip-group { font-size: 10px; color: var(--muted); margin-top: 2px; letter-spacing: .1em; text-transform: uppercase; }

  /* ── sidebar ── */
  .sidebar {
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
